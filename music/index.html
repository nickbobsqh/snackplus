<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNACK+ Music</title>
<link rel="icon" href="../icon.ico">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar glass">
  <a class="back" href="../">&larr; Hub</a>
  <img src="../logo.png" alt="" class="logo" style="height:42px" onerror="this.style.display='none'">
  <h1>Music Library</h1>
  <input id="search" class="search" type="search" placeholder="Search tracks...">
</header>

<main id="list"></main>
<p id="empty" hidden>No tracks found.</p>

<footer class="player glass" id="player" hidden>
  <img id="pCover" alt="">
  <div class="pInfo">
    <div id="pTitle"></div>
    <div id="pArtist"></div>
  </div>
  <div class="controls">
    <button class="pbtn" id="prev" aria-label="Previous">&#9198;</button>
    <button class="pbtn primary" id="play" aria-label="Play/Pause">&#9654;</button>
    <button class="pbtn" id="next" aria-label="Next">&#9197;</button>
    <button class="pbtn" id="shuffle">Shuffle: off</button>
  </div>
  <div class="progress">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="0" value="0" step="0.1">
    <span id="dur">0:00</span>
  </div>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
</footer>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
