<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNACK+</title>
<link rel="icon" href="icon.ico">
<style>
:root{--bg:#0a0412;--accent:#e8590c;--accent2:#ff8a3d;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.16);--blur:22px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:#f3ecfa;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0}
.b1{width:420px;height:420px;background:#3b0f6b;top:-100px;left:20%}
.b2{width:360px;height:360px;background:#7a2a05;bottom:-80px;right:10%}
.b3{width:300px;height:300px;background:#2a0a52;top:40%;left:-80px}
body.lite .blob{display:none}
body.lite{--blur:0px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid var(--edge);
 backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.4)}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:210px 1fr;grid-template-rows:84px 1fr;gap:12px;padding:12px}
.logo{border-radius:24px;display:flex;align-items:center;justify-content:center;padding:6px}
.logo img{max-height:100%;max-width:100%;object-fit:contain}
.top{border-radius:24px;display:flex;align-items:center;gap:12px;padding:0 16px}
.round{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid #fff;background:none;color:#fff;cursor:pointer;overflow:hidden;display:grid;place-items:center;padding:0}
.round.plain{border:none;width:40px;height:40px}
.round svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.round.plain:hover svg{stroke:var(--accent2);transform:rotate(60deg)}
.round svg{transition:.4s}
#avatar{width:100%;height:100%;object-fit:cover;display:none}
#search{flex:1;height:46px;border-radius:30px;border:1.5px solid var(--edge);background:rgba(0,0,0,.25);color:#fff;padding:0 20px;font-size:16px;outline:none}
#search:focus{border-color:var(--accent)}
.side{border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.side button{flex:1;background:none;border:none;border-bottom:1px solid var(--edge);color:#e7dcf3;font-size:16px;text-align:left;padding:0 20px;cursor:pointer;transition:.2s;min-height:44px}
.side button:last-child{border:none}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(90deg,rgba(232,89,12,.55),rgba(232,89,12,.08));color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--accent2)}
.main{border-radius:24px;padding:20px;overflow-y:auto;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.cover{aspect-ratio:2/3;background:linear-gradient(135deg,#3b0f6b,#8a3205);display:grid;place-items:center;font-weight:700;text-align:center;padding:10px;position:relative}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--edge)}
.badge.ex{background:var(--accent)}
.save{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.save.on{color:var(--accent2)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:16px}
.meta{font-size:12px;opacity:.7}
.desc{font-size:13px;opacity:.85;line-height:1.35}
.btns{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.pri{background:var(--accent);border-color:var(--accent2)}
.btn.pri:hover{background:var(--accent2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
select,.field{background:rgba(0,0,0,.35);color:#fff;border:1px solid var(--edge);border-radius:12px;padding:8px 12px;font-size:14px}
.empty{opacity:.7;padding:40px;text-align:center;grid-column:1/-1}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(5,0,10,.65);display:grid;place-items:center;padding:16px}
.hidden{display:none}
.dialog{border-radius:24px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto;background:rgba(30,12,50,.7)}
.dialog h2{margin-bottom:14px}
.dialog video{width:100%;border-radius:14px;background:#000}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.ep{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.ep .btns{margin:0;padding:0}.ep .btn{padding:6px 12px;flex:none}
.bigav{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#3b0f6b;border:2px solid var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--accent);padding:10px 20px;border-radius:20px;transition:.3s;z-index:20}
.toast.show{transform:translate(-50%,0)}
@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:64px 56px 1fr;height:100vh}
 .logo{display:none}.side{flex-direction:row;overflow-x:auto;grid-row:2}.side button{flex:none;white-space:nowrap;border-bottom:none;border-right:1px solid var(--edge);padding:0 14px}
 .top{grid-row:1}.main{grid-row:3}}

/* ── Loading Screen ── */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s,visibility .6s}
#loader.fade{opacity:0;visibility:hidden}
#loader .l-logo{width:160px;animation:pulse 2s ease-in-out infinite}
#loader .l-msg{font-size:15px;color:rgba(243,236,250,.75);max-width:400px;text-align:center;line-height:1.6;padding:0 24px}
#loader .l-bar{width:220px;height:3px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .l-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s ease}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}

/* ── AI Chatbot ── */
.chat-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0 12px;min-height:0}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.msg{max-width:80%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.5}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.09);border:1px solid var(--edge);border-bottom-left-radius:5px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(232,89,12,.65),rgba(255,138,61,.4));border:1px solid rgba(255,138,61,.3);border-bottom-right-radius:5px}
.chat-input-row{display:flex;gap:8px;margin-top:10px;flex-shrink:0}
.chat-input{flex:1;background:rgba(0,0,0,.3);border:1.5px solid var(--edge);border-radius:14px;color:#fff;padding:10px 14px;font-size:14px;outline:none;resize:none;font-family:inherit;line-height:1.4;min-height:44px;max-height:100px}
.chat-input:focus{border-color:var(--accent)}
.chat-send{width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center;flex-shrink:0;transition:.2s}
.chat-send:hover{background:var(--accent2)}
.chat-recs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chat-recs .rec-chip{background:rgba(232,89,12,.2);border:1px solid rgba(255,138,61,.3);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.2s}
.chat-recs .rec-chip:hover{background:rgba(232,89,12,.4)}
.chat-typing{opacity:.5;font-size:13px;padding:4px 0;align-self:flex-start}
.quiz-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quiz-opt{background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.2s}
.quiz-opt:hover{background:rgba(232,89,12,.3);border-color:var(--accent2)}
.quiz-opt.sel{background:rgba(232,89,12,.45);border-color:var(--accent2)}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">
  <img class="l-logo" src="logo.png" alt="SNACK+" onerror="this.style.display='none'">
  <div class="l-msg">Hello! You might know that me and a few other people made a website called SNACK+!</div>
  <div class="l-bar"><div class="l-fill" id="lFill"></div></div>
</div>

<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="app">
  <div class="logo glass"><img src="logo.png" alt="SNACK+"></div>
  <header class="top glass">
    <button id="profileBtn" class="round" title="Profile"><img id="avatar" alt=""><svg id="avatarIcon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
    <button id="settingsBtn" class="round plain" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <input id="search" type="search" placeholder="Search...">
  </header>
  <nav id="tabs" class="side glass"></nav>
  <main class="main glass">
    <div class="bar"><h1 id="title"></h1><div id="tools"></div></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<div id="modal" class="overlay hidden"><div class="dialog glass" id="dialog"></div></div>
<div id="toast" class="toast"></div>

<script>
// ── Tabs ──
const TABS = ["All","Original Language","Subbed","Dubbed","Exclusives","Watch Later","Recently Watched","Other Services","AI Recommends"];
const $ = s => document.querySelector(s);
const store = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};

let items=[],tab=0,sortNewest=true;
let saved=store.get("snack_saved",[]);
let recentlyWatched=store.get("snack_recent",[]);
let savedSort=store.get("snack_saved_sort","added-new");
let groups=store.get("snack_groups",[]),groupOf=store.get("snack_group_of",{});
let profile=store.get("snack_profile",{name:"",pic:""});
let settings=store.get("snack_settings",{lite:false});
// AI prefs
let aiPrefs=store.get("snack_ai_prefs",null);
let chatHistory=[];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}

// ── Loading Screen ──
(function(){
  const fill=document.getElementById("lFill");
  let p=0;
  const iv=setInterval(()=>{
    p=Math.min(p+(Math.random()*18+5),95);
    fill.style.width=p+"%";
  },200);
  window._loaderFinish=function(){
    clearInterval(iv);
    fill.style.width="100%";
    setTimeout(()=>document.getElementById("loader").classList.add("fade"),300);
  };
})();

async function init(){
  document.body.classList.toggle("lite",!!settings.lite);
  renderTabs();renderProfile();
  try{
    const r=await fetch("movies.txt",{cache:"no-store"});
    items=JSON.parse(await r.text());
  }catch(e){items=[];toast("Could not load movies.txt")}
  render();
  openFromHash();
  window._loaderFinish();
}

function renderTabs(){
  $("#tabs").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" data-i="${i}">${t}</button>`).join("");
  $("#tabs").onclick=e=>{
    const b=e.target.closest("button");
    if(b){tab=+b.dataset.i;$("#search").value="";renderTabs();render()}
  };
}
function renderProfile(){
  const a=$("#avatar");
  if(profile.pic){a.src=profile.pic;a.style.display="block";$("#avatarIcon").style.display="none"}
  else{a.style.display="none";$("#avatarIcon").style.display=""}
  $("#profileBtn").title=profile.name||"Profile";
}

function sortList(l){
  l.sort((a,b)=>new Date(b.added)-new Date(a.added));
  if(!sortNewest)l.reverse();
  return l;
}
const SAVED_SORTS={"added-new":"Date added: newest","added-old":"Date added: oldest","az":"Title A–Z","za":"Title Z–A"};
function sortSaved(l){
  const t=(a,b)=>a.title.localeCompare(b.title);
  const f={
    "added-new":(a,b)=>new Date(b.added)-new Date(a.added),
    "added-old":(a,b)=>new Date(a.added)-new Date(b.added),
    az:t,za:(a,b)=>t(b,a)
  };
  return l.sort(f[savedSort]||f["added-new"]);
}

function filtered(){
  const q=$("#search").value.trim().toLowerCase();
  let l=[...items];
  if(q){return sortList(l.filter(i=>[i.title,i.genre,i.type,i.year,i.description].join(" ").toLowerCase().includes(q)))}
  switch(tab){
    case 1:l=l.filter(i=>!i.subbed&&!i.dubbed);break;
    case 2:l=l.filter(i=>i.subbed);break;
    case 3:l=l.filter(i=>i.dubbed);break;
    case 4:l=l.filter(i=>i.exclusive);break;
    case 5:return sortSaved(l.filter(i=>saved.includes(i.id)));
    case 6:{
      // Recently Watched — preserve order (most recent first)
      const rw=recentlyWatched.slice().reverse();
      const ordered=rw.map(id=>l.find(i=>i.id===id)).filter(Boolean);
      return ordered;
    }
    case 7:return null; // Other Services WIP
    case 8:return "AI"; // AI Recommends
  }
  return sortList(l);
}

function render(){
  const q=$("#search").value.trim();
  $("#title").textContent=q?`Search: ${q}`:TABS[tab];
  const tools=$("#tools");tools.innerHTML="";
  const watchLaterTab=(tab==5&&!q);
  const recentTab=(tab==6&&!q);
  const aiTab=(tab==8);

  if(watchLaterTab){
    tools.innerHTML=`<select id="sort">${Object.entries(SAVED_SORTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <button class="btn" id="addGroup">+ Group</button> <button class="btn" id="exp">Export</button> <button class="btn" id="imp">Import</button>`;
    $("#sort").value=savedSort;
    $("#sort").onchange=e=>{savedSort=e.target.value;store.set("snack_saved_sort",savedSort);render()};
    $("#addGroup").onclick=addGroup;
    $("#exp").onclick=exportSaved;$("#imp").onclick=importSaved;
  } else if(recentTab){
    tools.innerHTML=`<button class="btn" id="clrRecent" style="color:#f99">Clear History</button>`;
    $("#clrRecent").onclick=()=>{if(confirm("Clear recently watched history?")){recentlyWatched=[];store.set("snack_recent",recentlyWatched);render()}};
  } else if(!aiTab&&tab!=7){
    tools.innerHTML=`<select id="sort"><option value="n">Newest to oldest</option><option value="o">Oldest to newest</option></select>`;
    $("#sort").value=sortNewest?"n":"o";
    $("#sort").onchange=e=>{sortNewest=e.target.value=="n";render()};
  }

  const l=filtered();
  const g=$("#grid");

  // AI Recommends tab
  if(l==="AI"){
    g.innerHTML=`<div style="grid-column:1/-1">${renderChat()}</div>`;
    bindChat();
    return;
  }
  if(l===null){g.innerHTML=`<div class="empty"><h2>This Page is a W.I.P</h2></div>`;return}
  if(!l.length){
    if(recentTab) g.innerHTML=`<div class="empty">Nothing watched yet. Hit Watch on any title to track it here.</div>`;
    else if(watchLaterTab) g.innerHTML=`<div class="empty">Nothing saved yet. Tap the ♥ on a title to save it.</div>`;
    else g.innerHTML=`<div class="empty">Nothing here.</div>`;
    return;
  }
  if(!watchLaterTab){g.innerHTML=l.map(card).join("");return}
  // grouped watch later
  const grouped=(name)=>l.filter(i=>(groupOf[i.id]||"")==name);
  const valid=groups.filter(Boolean);
  if(!valid.length){g.innerHTML=l.map(card).join("");return}
  const ungrouped=l.filter(i=>!valid.includes(groupOf[i.id]));
  const section=(name,list,del)=>`<section style="grid-column:1/-1"><div class="bar" style="margin-bottom:10px"><h2>${esc(name)} <small>(${list.length})</small></h2>${del?`<button class="btn" data-gdel="${esc(name)}">Delete group</button>`:""}</div>
    <div class="grid">${list.length?list.map(card).join(""):`<div class="empty">No titles in this group.</div>`}</div></section>`;
  g.innerHTML=valid.map(n=>section(n,grouped(n),true)).join("")+(ungrouped.length?section("Ungrouped",ungrouped,false):"");
}

function addGroup(){
  const name=(prompt("Group name:")||"").trim();
  if(!name)return;
  if(groups.includes(name))return toast("A group with that name already exists");
  groups=[...groups,name];store.set("snack_groups",groups);render();
}

function card(i){
  const isSaved=saved.includes(i.id),m=i.type=="movie";
  const b=[m?"Movie":"Show",i.subbed&&"Subbed",i.dubbed&&"Dubbed"].filter(Boolean).map(x=>`<span class="badge">${x}</span>`).join("")+(i.exclusive?`<span class="badge ex">Dubbed by SNACK</span>`:"");
  const btns=m?`<button class="btn pri" data-a="watch" ${i.watch?"":"disabled"}>Watch</button><button class="btn" data-a="dl" ${i.download?"":"disabled"}>Download</button><button class="btn" data-a="share">Share</button>`
   :`<button class="btn pri" data-a="eps">Episodes</button>`;
  const grp=tab==5&&!$("#search").value.trim()&&groups.length?`<select class="grp" data-a="grp" title="Group"><option value="">Ungrouped</option>${groups.map(n=>`<option ${groupOf[i.id]==n?"selected":""}>${esc(n)}</option>`).join("")}</select>`:"";
  return `<article class="card glass" data-id="${esc(i.id)}">
   <div class="cover"><span>${esc(i.title)}</span><img src="${esc(i.cover)}" alt="" onerror="this.remove()">
   <div class="badges">${b}</div><button class="save ${isSaved?"on":""}" data-a="save" title="Save">${isSaved?"♥":"♡"}</button></div>
   <div class="info"><h3>${esc(i.title)}</h3>
   <div class="meta">${esc(i.year)} • ${esc(i.genre)} • ★ ${esc(i.rating)} • ${esc(i.duration)}</div>
   <div class="desc">${esc(i.description)}</div>${grp}<div class="btns">${btns}</div></div></article>`;
}

$("#grid").onclick=e=>{
  const d=e.target.closest("[data-gdel]");
  if(d){const n=d.dataset.gdel;if(confirm(`Delete group "${n}"? Its titles stay saved.`)){
    groups=groups.filter(x=>x!=n);store.set("snack_groups",groups);
    Object.keys(groupOf).forEach(k=>{if(groupOf[k]==n)delete groupOf[k]});store.set("snack_group_of",groupOf);render()}return}
  const b=e.target.closest("[data-a]");if(!b||b.tagName=="SELECT")return;
  const it=items.find(x=>x.id==b.closest(".card").dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a=="save"){saved=saved.includes(it.id)?saved.filter(x=>x!=it.id):[...saved,it.id];store.set("snack_saved",saved);render()}
  else if(a=="watch")play(it.watch,it.title,null,it.id);
  else if(a=="dl")download(it.download,it.title);
  else if(a=="share")share(it.id);
  else if(a=="eps")episodes(it);
};
$("#grid").onchange=e=>{
  const s=e.target.closest(".grp");if(!s)return;
  const it=items.find(x=>x.id==s.closest(".card").dataset.id);if(!it)return;
  if(s.value)groupOf[it.id]=s.value;else delete groupOf[it.id];
  store.set("snack_group_of",groupOf);render();
};
$("#search").oninput=render;

function openModal(h){$("#dialog").innerHTML=h;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden");$("#dialog").innerHTML="";if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
$("#modal").onclick=e=>{if(e.target.id=="modal"||e.target.closest("[data-close]"))closeModal()};
document.onkeydown=e=>{if(e.key=="Escape")closeModal()};

function markWatched(id){
  if(!id)return;
  recentlyWatched=recentlyWatched.filter(x=>x!==id);
  recentlyWatched.push(id);
  if(recentlyWatched.length>50)recentlyWatched=recentlyWatched.slice(-50);
  store.set("snack_recent",recentlyWatched);
}

function play(url,title,back,itemId){
  if(!url)return toast("Not available to watch");
  if(itemId)markWatched(itemId);
  const backBtn=back?`<button class="btn" data-back>Back to episodes</button>`:"";
  openModal(`<h2>${esc(title)}</h2><video src="${esc(url)}" controls autoplay playsinline></video><div class="row">${backBtn}<button class="btn" data-close>Close</button></div>`);
  if(back)$("#dialog").onclick=ev=>{if(ev.target.closest("[data-back]"))back()};
}
const epLabel=(it,e)=>`${it.title} - Season ${e.season||1} ${e.title}`;
function download(url,title){
  if(!url)return toast("Download not available");
  const a=document.createElement("a");a.href=url;a.download=title;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
}
async function share(id,ep){
  const url=location.origin+location.pathname+"#"+id+(ep!=null?"/"+ep:"");
  try{await navigator.clipboard.writeText(url);toast("Link copied")}catch{prompt("Copy this link:",url)}
}
function episodes(it,season){
  const eps=it.episodes||[];
  const seasons=[...new Set(eps.map(e=>e.season||1))].sort((a,b)=>a-b);
  if(season==null){
    const rows=seasons.map(s=>{const n=eps.filter(e=>(e.season||1)==s).length;
      return `<button class="btn season" data-s="${s}">Season ${s} - <span>${n} episode${n==1?"":"s"}</span></button>`}).join("");
    openModal(`<h2>${esc(it.title)} - Seasons</h2>${rows||"<p>No episodes yet.</p>"}<div class="row"><button class="btn" data-close>Close</button></div>`);
  }else{
    const rows=eps.map((e,n)=>[e,n]).filter(([e])=>(e.season||1)==season).map(([e,n])=>`<div class="ep"><span>${esc(e.title)}</span><div class="btns">
   <button class="btn pri" data-e="w${n}" ${e.watch?"":"disabled"}>Watch</button>
   <button class="btn" data-e="d${n}" ${e.download?"":"disabled"}>Download</button>
   <button class="btn" data-e="s${n}">Share</button></div></div>`).join("");
    openModal(`<h2>${esc(it.title)} - Season ${season}</h2>${rows||"<p>No episodes in this season.</p>"}<div class="row"><button class="btn" data-back>Back to seasons</button><button class="btn" data-close>Close</button></div>`);
  }
  $("#dialog").onclick=ev=>{
    if(ev.target.closest("[data-back]"))return episodes(it);
    const sb=ev.target.closest("[data-s]");if(sb)return episodes(it,+sb.dataset.s);
    const b=ev.target.closest("[data-e]");if(!b)return;
    const n=+b.dataset.e.slice(1),e=it.episodes[n],k=b.dataset.e[0];
    if(k=="w")play(e.watch,epLabel(it,e),()=>episodes(it,e.season||1),it.id);
    else if(k=="d")download(e.download,epLabel(it,e));
    else share(it.id,n)};
}
function openFromHash(){
  const [id,ep]=decodeURIComponent(location.hash.slice(1)).split("/");
  const it=items.find(x=>x.id==id);if(!it)return;
  if(it.type=="movie")play(it.watch,it.title,null,it.id);
  else if(ep!=null&&it.episodes?.[ep]?.watch){const e=it.episodes[ep];play(e.watch,epLabel(it,e),()=>episodes(it,e.season||1),it.id)}
  else episodes(it);
}
addEventListener("hashchange",()=>items.length&&openFromHash());

function exportSaved(){
  const blob=new Blob([JSON.stringify({snack_saved:saved})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="snack-saved.json";a.click();
}
function importSaved(){
  const f=document.createElement("input");f.type="file";f.accept=".json,.txt,application/json";
  f.onchange=async()=>{try{
    const d=JSON.parse(await f.files[0].text());
    const l=Array.isArray(d)?d:d.snack_saved;
    if(!Array.isArray(l))throw 0;
    saved=[...new Set([...saved,...l.map(String)])];store.set("snack_saved",saved);render();toast("Imported")
  }catch{toast("Invalid file")}};
  f.click();
}

$("#profileBtn").onclick=()=>{
  let pic=profile.pic;
  openModal(`<h2>Profile</h2><div class="row"><img class="bigav" id="pp" src="${esc(pic)}" alt="">
   <input type="file" id="pf" accept="image/*"></div>
   <div class="row"><input class="field" id="pn" placeholder="Your name" maxlength="30" value="${esc(profile.name)}"></div>
   <div class="row"><button class="btn pri" id="ps">Save</button><button class="btn" data-close>Cancel</button></div>`);
  $("#pf").onchange=e=>{const file=e.target.files[0];if(!file)return;
    const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;
      const s=Math.min(img.width,img.height),x=c.getContext("2d");
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      pic=c.toDataURL("image/jpeg",.85);$("#pp").src=pic};
    img.src=URL.createObjectURL(file)};
  $("#ps").onclick=()=>{profile={name:$("#pn").value.trim(),pic};store.set("snack_profile",profile);renderProfile();closeModal();toast(profile.name?"Welcome, "+profile.name:"Saved")};
};
$("#settingsBtn").onclick=()=>{
  openModal(`<h2>Settings</h2>
   <label class="row"><input type="checkbox" id="sl" ${settings.lite?"checked":""}> Performance mode (disable blur &amp; glow effects)</label>
   <div class="row"><button class="btn" id="sc">Clear all local data</button></div>
   <div class="row"><button class="btn pri" data-close>Done</button></div>`);
  $("#sl").onchange=e=>{settings.lite=e.target.checked;store.set("snack_settings",settings);document.body.classList.toggle("lite",settings.lite)};
  $("#sc").onclick=()=>{if(confirm("Clear profile, saved list and settings?")){localStorage.clear();location.reload()}};
};

// ═══════════════════════════════════════════
//  AI RECOMMENDS CHATBOT
// ═══════════════════════════════════════════
const QUIZ = [
  {
    q: "What type of content do you usually enjoy?",
    opts: ["Movies","Shows","Both"]
  },
  {
    q: "Pick your favourite genres (choose one to start):",
    opts: ["Action / Thriller","Drama / Romance","Comedy","Sci-Fi / Fantasy","Horror","Documentary","Animation"]
  },
  {
    q: "How do you prefer to watch?",
    opts: ["Subbed (original language + subs)","Dubbed (Persian)","No preference"]
  },
  {
    q: "What mood are you in?",
    opts: ["Something light & fun","Something intense & gripping","Something emotional","Something mind-bending","Surprise me!"]
  }
];

let quizStep=0;
let quizAnswers=[];
let chatReady=false;

function renderChat(){
  return `<div class="chat-wrap" id="chatWrap" style="height:calc(100vh - 220px)">
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Ask me anything about what to watch..." rows="1"></textarea>
      <button class="chat-send" id="chatSend" title="Send">&#x27A4;</button>
    </div>
  </div>`;
}

function bindChat(){
  if(!document.getElementById("chatMsgs"))return;
  chatHistory=[];
  if(aiPrefs){
    chatReady=true;
    botMsg("Hey! I know your taste already. Ask me what to watch — or type something like \"show me action movies\" or \"something light tonight\".");
  } else {
    chatReady=false;
    quizStep=0;quizAnswers=[];
    botMsg("Hi! I'm your SNACK+ AI assistant. I'll recommend titles from our catalog based on your taste. Let's start with a quick questionnaire!");
    setTimeout(()=>askQuiz(0),400);
  }
  document.getElementById("chatSend").onclick=sendChat;
  document.getElementById("chatInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}};
}

function botMsg(text,chips){
  const msgs=document.getElementById("chatMsgs");if(!msgs)return;
  const div=document.createElement("div");
  div.className="msg bot";
  div.textContent=text;
  msgs.appendChild(div);
  if(chips&&chips.length){
    const row=document.createElement("div");
    row.className="chat-recs";
    chips.forEach(c=>{
      const ch=document.createElement("button");
      ch.className="rec-chip";
      ch.textContent=c.title+(c.year?" ("+c.year+")":"");
      ch.onclick=()=>{
        // Switch to All tab and highlight item
        tab=0;renderTabs();render();
        setTimeout(()=>{
          const el=document.querySelector(`.card[data-id="${CSS.escape(c.id)}"]`);
          if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="2px solid var(--accent2)";setTimeout(()=>el.style.outline="",2000);}
        },100);
      };
      row.appendChild(ch);
    });
    msgs.appendChild(row);
  }
  msgs.scrollTop=msgs.scrollHeight;
}

function userMsg(text){
  const msgs=document.getElementById("chatMsgs");if(!msgs)return;
  const div=document.createElement("div");
  div.className="msg user";
  div.textContent=text;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function askQuiz(step){
  if(step>=QUIZ.length){
    // Done with quiz
    aiPrefs={type:quizAnswers[0],genre:quizAnswers[1],lang:quizAnswers[2],mood:quizAnswers[3]};
    store.set("snack_ai_prefs",aiPrefs);
    chatReady=true;
    botMsg("Perfect! I've got a feel for your taste. Here are some picks to start with:");
    setTimeout(()=>{
      const recs=getRecommendations(aiPrefs,recentlyWatched,6);
      if(recs.length){
        botMsg("Tap any title to find it in the catalog:",recs);
      } else {
        botMsg("The catalog is currently empty — once titles are added I'll be able to suggest them. Ask me anything in the meantime!");
      }
    },500);
    return;
  }
  const q=QUIZ[step];
  const msgs=document.getElementById("chatMsgs");if(!msgs)return;
  const wrap=document.createElement("div");
  const msgDiv=document.createElement("div");
  msgDiv.className="msg bot";msgDiv.textContent=q.q;
  wrap.appendChild(msgDiv);
  const opts=document.createElement("div");
  opts.className="quiz-opts";
  q.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="quiz-opt";b.textContent=o;
    b.onclick=()=>{
      // Disable all opts in this step
      opts.querySelectorAll(".quiz-opt").forEach(x=>x.disabled=true);
      b.classList.add("sel");
      quizAnswers[step]=o;
      userMsg(o);
      quizStep=step+1;
      setTimeout(()=>askQuiz(step+1),350);
    };
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}

function getRecommendations(prefs,watchedIds,limit){
  if(!items.length)return[];
  let pool=[...items];
  // Filter out already watched
  pool=pool.filter(i=>!watchedIds.includes(i.id));
  if(!pool.length)pool=[...items]; // if all watched, ignore filter
  // Score each item
  const scored=pool.map(it=>{
    let score=0;
    const p=prefs||{};
    // type
    if(p.type==="Movies"&&it.type==="movie")score+=3;
    if(p.type==="Shows"&&it.type==="show")score+=3;
    if(p.type==="Both")score+=1;
    // genre
    if(p.genre){
      const g=(p.genre||"").toLowerCase();
      const itg=(it.genre||"").toLowerCase();
      const genreMap={"action / thriller":["action","thriller"],"drama / romance":["drama","romance"],"comedy":["comedy"],"sci-fi / fantasy":["sci-fi","fantasy","science fiction"],"horror":["horror"],"documentary":["documentary"],"animation":["animation","anime"]};
      const keys=genreMap[g]||[g.split("/")[0].trim()];
      if(keys.some(k=>itg.includes(k)))score+=4;
    }
    // lang
    if(p.lang==="Subbed (original language + subs)"&&it.subbed)score+=2;
    if(p.lang==="Dubbed (Persian)"&&it.dubbed)score+=2;
    // mood
    if(p.mood){
      const m=(p.mood||"").toLowerCase();
      const desc=((it.description||"")+" "+(it.genre||"")).toLowerCase();
      if(m.includes("light")&&(desc.includes("comedy")||desc.includes("fun")||desc.includes("romantic")))score+=3;
      if(m.includes("intense")&&(desc.includes("thriller")||desc.includes("action")||desc.includes("suspense")))score+=3;
      if(m.includes("emotional")&&(desc.includes("drama")||desc.includes("emotional")||desc.includes("touching")))score+=3;
      if(m.includes("mind")&&(desc.includes("sci-fi")||desc.includes("mystery")||desc.includes("twist")))score+=3;
      if(m.includes("surprise"))score+=Math.random()*5; // random boost
    }
    // rating boost
    score+=(parseFloat(it.rating)||0)*0.3;
    return {it,score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit).map(x=>x.it);
}

function sendChat(){
  const input=document.getElementById("chatInput");
  if(!input)return;
  const text=input.value.trim();
  if(!text)return;
  input.value="";
  userMsg(text);
  if(!chatReady){
    botMsg("Please finish the quick questionnaire first so I can personalise your picks!");
    return;
  }
  setTimeout(()=>processQuery(text),300);
}

function processQuery(query){
  const q=query.toLowerCase();
  // Build a custom prefs object from the query + stored prefs
  const base=aiPrefs||{};
  let overridePrefs={...base};
  let genreHit=null;
  const genreKW={"action":["action","thriller","fight"],"drama":["drama","emotional","touching","sad"],"comedy":["comedy","funny","laugh","light","fun"],"sci-fi":["sci-fi","scifi","science fiction","space","futur","mind-bending","twist"],"horror":["horror","scary","frightening"],"documentary":["documentary","real","true story"],"animation":["animation","anime","cartoon"],"romance":["romance","romantic","love"]};
  for(const[g,kws]of Object.entries(genreKW)){if(kws.some(k=>q.includes(k))){genreHit=g;break}}
  if(genreHit){overridePrefs.genre=genreHit;}

  // Type override
  if(q.includes("movie"))overridePrefs.type="Movies";
  else if(q.includes("show")||q.includes("series"))overridePrefs.type="Shows";

  // Mood
  if(q.includes("light")||q.includes("fun"))overridePrefs.mood="Something light & fun";
  if(q.includes("intense")||q.includes("gripping"))overridePrefs.mood="Something intense & gripping";
  if(q.includes("emotional"))overridePrefs.mood="Something emotional";
  if(q.includes("mind")||q.includes("twist"))overridePrefs.mood="Something mind-bending";
  if(q.includes("surprise"))overridePrefs.mood="Surprise me!";

  // Subbed/dubbed
  if(q.includes("subbed")||q.includes("sub"))overridePrefs.lang="Subbed (original language + subs)";
  if(q.includes("dubbed")||q.includes("dub"))overridePrefs.lang="Dubbed (Persian)";

  const recs=getRecommendations(overridePrefs,recentlyWatched,5);

  // Response
  let reply="";
  if(!items.length){
    reply="The catalog is empty right now. Add titles through the editor and I'll be able to suggest them!";
    botMsg(reply);return;
  }
  if(!recs.length){
    reply="Hmm, nothing in the catalog quite matches that. Try a different genre or ask for something else!";
    botMsg(reply);return;
  }

  const intros=["Here's what I'd recommend:","How about these:","You might enjoy:","These should hit the spot:","Based on your taste:"];
  reply=intros[Math.floor(Math.random()*intros.length)];
  botMsg(reply,recs);

  // Follow-up prompt
  setTimeout(()=>{
    const followups=["Want something different? Just ask!","Tell me a mood or genre to refine the picks.","I can also filter by subbed or dubbed — just say the word."];
    botMsg(followups[Math.floor(Math.random()*followups.length)]);
  },600);
}

init();
</script>
