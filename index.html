<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNACK+</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.png" alt="" class="logo" onerror="this.style.display='none'">
  <h1>SNACK<span>+</span></h1>
  <input id="search" type="search" placeholder="Search shows...">
</header>

<main id="grid"></main>
<p id="empty" hidden>No shows found.</p>

<div id="modal" class="modal" hidden>
  <div class="panel">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
