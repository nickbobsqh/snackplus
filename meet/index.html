<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNACK+ Meet</title>
<link rel="icon" href="assets/icon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="snack">

<!-- LOBBY -->
<section id="lobby" class="screen active">
  <header class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand-name">SNACK<span class="plus">+</span></span>
    <span class="suffix">Meet</span>
  </header>

  <div class="card lobby-card">
    <h1>Video meetings, peer to peer</h1>
    <p class="muted">Calls go directly between browsers over WebRTC. No account and no server.</p>

    <label class="field">
      <span>Your name</span>
      <input id="name" type="text" maxlength="32" placeholder="Your name" autocomplete="off">
    </label>

    <label class="field">
      <span>Meeting code</span>
      <div class="row">
        <input id="room" type="text" maxlength="40" placeholder="e.g. team-standup" autocomplete="off">
        <button id="randomRoom" class="btn tonal icon-only" title="Generate code" aria-label="Generate code">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
      </div>
    </label>

    <div class="row end">
      <button id="joinBtn" class="btn filled">Join meeting</button>
    </div>

    <div class="theme-picker" role="radiogroup" aria-label="Theme">
      <span class="muted">Theme</span>
      <div class="swatches" id="themeSwatchesLobby"></div>
    </div>
  </div>
</section>

<!-- ROOM -->
<section id="room" class="screen">
  <header class="topbar">
    <div class="brand small">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">SNACK<span class="plus">+</span></span>
      <span class="suffix">Meet</span>
    </div>
    <div class="meta">
      <span id="roomLabel" class="chip"></span>
      <span id="peerCount" class="chip">1</span>
      <button id="copyLink" class="btn tonal" title="Copy invite link">
        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        <span>Copy invite</span>
      </button>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <footer class="toolbar">
    <button id="micBtn" class="round" title="Microphone" aria-label="Microphone">
      <svg class="i-on" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17L15 5.18V5a3 3 0 0 0-5.94-.6l1.8 1.8L12 11.17zM4.27 3 3 4.27l6.01 6.01V11a3 3 0 0 0 3.5 2.96l1.45 1.45c-.7.35-1.5.58-2.36.6V20h2v-2.92a7 7 0 0 0 5.94-3.3L19.73 20 21 18.73 4.27 3z"/></svg>
    </button>
    <button id="camBtn" class="round" title="Camera" aria-label="Camera">
      <svg class="i-on" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5zM3.27 2 2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>
    </button>
    <button id="shareBtn" class="round" title="Share screen" aria-label="Share screen">
      <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
    </button>
    <button id="leaveBtn" class="round danger" title="Leave" aria-label="Leave">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </footer>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
